name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create releases and upload assets
  id-token: write       # npm provenance

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        # Required so bun build / bun test can resolve @getmanza/sdk
        # (a runtime dep, not a stdlib module). Same omission we hit
        # on the manza-ts release workflow.
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          pkg="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg (bin/release writes it via scripts/version)"
            exit 1
          fi

      - name: Tests
        run: bun test

      - name: Smoke-test compiled binary (host platform)
        # bun test only exercises the source; this catches `bun build
        # --compile` regressions before we publish broken installs to
        # GitHub Releases / npm / Homebrew.
        #
        # SDK ↔ API contract drift is caught upstream: manza-ruby
        # records cassettes against the live staging API on every
        # release, and manza-ts (and therefore the cli, via its SDK
        # dep) replays those cassettes. We don't repeat a third live
        # check here.
        run: |
          set -euo pipefail
          bun run compile
          ./dist/manza --version
          ./dist/manza --help > /dev/null

      - name: Cross-compile binaries
        run: bun run build

      - name: Upload binaries (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: manza-cli-binaries
          path: |
            dist/manza-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  github_release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: manza-cli-binaries
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/manza-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm_publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write          # OIDC token for npm trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      # Deliberately NOT setting registry-url. setup-node's
      # registry-url triggers it to write _authToken=${NODE_AUTH_TOKEN}
      # into ~/.npmrc, which makes npm see "auth already configured"
      # and skip the OIDC trusted-publishing exchange — even when the
      # token is empty. We want OIDC, so we leave ~/.npmrc untouched
      # and let `npm publish` discover the GitHub Actions OIDC
      # environment via id-token: write.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: manza-cli-binaries
          path: dist

      - name: Publish per-platform packages and the parent package
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/npm-publish

  homebrew_bump:
    name: Bump Homebrew formula
    needs: github_release
    runs-on: ubuntu-26.04
    # Gated on the PUBLISH_HOMEBREW repo variable so we can soak-test
    # releases against a private getmanza/cli without writing a broken
    # Homebrew formula (the formula's URLs would 404 to anyone fetching
    # them while the repo is private). Flip to "true" via:
    #   gh variable set PUBLISH_HOMEBREW --repo getmanza/cli --body "true"
    # at the same moment getmanza/cli is made public.
    if: ${{ vars.PUBLISH_HOMEBREW == 'true' }}

    steps:
      - name: Bump formula
        env:
          # Fine-grained PAT scoped to getmanza/homebrew-tap with
          # Contents: Read and write. Set via:
          #   gh secret set HOMEBREW_TAP_TOKEN --repo getmanza/cli
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"

          # Pull the SHA256SUMS file we just released.
          gh release download "v$version" \
            --repo getmanza/cli \
            --pattern SHA256SUMS \
            --output SHA256SUMS

          sha_darwin_arm64="$(awk '/manza-darwin-arm64$/ {print $1}' SHA256SUMS)"
          sha_darwin_x64="$(awk '/manza-darwin-x64$/ {print $1}' SHA256SUMS)"
          sha_linux_arm64="$(awk '/manza-linux-arm64$/ {print $1}' SHA256SUMS)"
          sha_linux_x64="$(awk '/manza-linux-x64$/ {print $1}' SHA256SUMS)"

          # Fail loud if any expected checksum is missing, instead of
          # silently writing a broken Homebrew formula with empty
          # sha256 fields.
          for pair in \
            "darwin-arm64:${sha_darwin_arm64}" \
            "darwin-x64:${sha_darwin_x64}" \
            "linux-arm64:${sha_linux_arm64}" \
            "linux-x64:${sha_linux_x64}"
          do
            target="${pair%%:*}"
            sha="${pair#*:}"
            if [ -z "$sha" ]; then
              echo "::error::Missing SHA256 for ${target} in SHA256SUMS — refusing to write broken Homebrew formula"
              exit 1
            fi
          done

          # Clone, write formula, push.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/getmanza/homebrew-tap.git" tap
          cd tap

          mkdir -p Formula
          cat > Formula/manza.rb <<RUBY
          # typed: false
          # frozen_string_literal: true

          class Manza < Formula
            desc "Command-line interface for the Manza API"
            homepage "https://github.com/getmanza/cli"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/getmanza/cli/releases/download/v#{version}/manza-darwin-arm64"
                sha256 "${sha_darwin_arm64}"
              end
              on_intel do
                url "https://github.com/getmanza/cli/releases/download/v#{version}/manza-darwin-x64"
                sha256 "${sha_darwin_x64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/getmanza/cli/releases/download/v#{version}/manza-linux-arm64"
                sha256 "${sha_linux_arm64}"
              end
              on_intel do
                url "https://github.com/getmanza/cli/releases/download/v#{version}/manza-linux-x64"
                sha256 "${sha_linux_x64}"
              end
            end

            def install
              binary = case
                       when OS.mac? && Hardware::CPU.arm? then "manza-darwin-arm64"
                       when OS.mac? && Hardware::CPU.intel? then "manza-darwin-x64"
                       when OS.linux? && Hardware::CPU.arm? then "manza-linux-arm64"
                       when OS.linux? && Hardware::CPU.intel? then "manza-linux-x64"
                       end
              bin.install binary => "manza"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/manza --version")
            end
          end
          RUBY

          # The zazu formula stays installable but frozen at 0.x; point
          # its users at manza. It ships no zazu shim of its own: a
          # bin/zazu in manza.rb would collide with the old formula's
          # link for anyone who still has it installed.
          if [ -f Formula/zazu.rb ] && ! grep -q 'deprecate!' Formula/zazu.rb; then
            sed -i "/^  license /a\\  deprecate! date: \"$(date -u +%F)\", because: \"has been renamed to manza; run: brew install getmanza/tap/manza\"" Formula/zazu.rb
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/manza.rb
          if [ -f Formula/zazu.rb ]; then git add Formula/zazu.rb; fi

          # Make the tap update idempotent: if the formula is already
          # exactly what we'd write (e.g. job re-run after a transient
          # failure later in the pipeline), exit cleanly instead of
          # failing on `git commit` with "nothing to commit".
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${version}"
            exit 0
          fi

          git commit -m "manza ${version}"
          git push
